<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>FX Currency Exchange - Finanza Bank</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/user-portal.css" rel="stylesheet">
</head>
<body data-page-title="Foreign Exchange (FX) Desk" data-page-subtitle="Institutional spot rates & instant multi-currency conversion">

<div id="bank-page-content" style="display:none;">
    <div class="row g-4">
        <!-- FX Conversion Ticket -->
        <div class="col-lg-6">
            <div class="fb-card">
                <div class="fb-card-header">
                    <h2 class="fb-card-title"><i class="fas fa-coins text-primary"></i> Instant FX Currency Conversion</h2>
                    <span class="fb-badge fb-badge-info">Interbank Spot Feed</span>
                </div>
                <div class="fb-card-body">
                    <form id="fxConvertForm">
                        <div class="mb-3">
                            <label class="form-label">Source Account</label>
                            <select class="form-select" id="fxSourceAccount" required></select>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Sell Currency</label>
                                <select class="form-select" id="fxFromCurrency" onchange="recalcFX()">
                                    <option value="USD" selected>USD — US Dollar ($)</option>
                                    <option value="EUR">EUR — Euro (€)</option>
                                    <option value="GBP">GBP — British Pound (£)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Buy Target Currency</label>
                                <select class="form-select" id="fxToCurrency" onchange="recalcFX()">
                                    <option value="EUR" selected>EUR — Euro (€)</option>
                                    <option value="GBP">GBP — British Pound (£)</option>
                                    <option value="CAD">CAD — Canadian Dollar (C$)</option>
                                    <option value="CHF">CHF — Swiss Franc (Fr)</option>
                                    <option value="JPY">JPY — Japanese Yen (¥)</option>
                                    <option value="AUD">AUD — Australian Dollar (A$)</option>
                                    <option value="NGN">NGN — Nigerian Naira (₦)</option>
                                    <option value="ZAR">ZAR — South African Rand (R)</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Amount to Convert</label>
                            <div class="input-group">
                                <span class="input-group-text fw-bold" id="fxFromSym">$</span>
                                <input type="number" class="form-control fw-bold fs-5" id="fxSellAmount" min="10" step="0.01" value="1000.00" oninput="recalcFX()" required>
                            </div>
                        </div>

                        <div class="p-3 rounded-3 bg-light border mb-4">
                            <div class="d-flex justify-content-between small mb-2">
                                <span class="text-muted">Indicative Exchange Rate</span>
                                <span class="fw-bold font-mono" id="fxRateText">1 USD = 0.9215 EUR</span>
                            </div>
                            <div class="d-flex justify-content-between small mb-2">
                                <span class="text-muted">FX Conversion Spread</span>
                                <span class="fw-semibold text-success">0.25% Institutional Tier</span>
                            </div>
                            <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                                <span class="fw-semibold">Net Converted Proceeds</span>
                                <span class="fs-4 fw-extrabold text-primary tabular-nums" id="fxReceivePreview">919.20 EUR</span>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2" id="fxSubmitBtn">
                            <i class="fas fa-repeat me-2"></i> Execute FX Conversion
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Live Rates Board -->
        <div class="col-lg-6">
            <div class="fb-card h-100">
                <div class="fb-card-header">
                    <h2 class="fb-card-title"><i class="fas fa-globe text-primary"></i> Major Currency Pairs (Base: USD)</h2>
                    <button class="btn btn-sm btn-outline-secondary" onclick="recalcFX()"><i class="fas fa-rotate me-1"></i>Refresh</button>
                </div>
                <div class="table-responsive">
                    <table class="fb-table">
                        <thead>
                            <tr>
                                <th>Currency Pair</th>
                                <th>Currency Name</th>
                                <th class="text-end">Spot Rate</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody id="fxRatesTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/user-shell.js"></script>
<script>
const FX_BENCHMARK_USD = {
    USD: { name: 'US Dollar', rate: 1.0000 },
    EUR: { name: 'Eurozone Euro', rate: 0.9215 },
    GBP: { name: 'British Pound Sterling', rate: 0.7890 },
    CAD: { name: 'Canadian Dollar', rate: 1.3640 },
    CHF: { name: 'Swiss Franc', rate: 0.8825 },
    JPY: { name: 'Japanese Yen', rate: 151.85 },
    AUD: { name: 'Australian Dollar', rate: 1.5230 },
    NGN: { name: 'Nigerian Naira', rate: 1595.00 },
    ZAR: { name: 'South African Rand', rate: 18.42 }
};

function recalcFX() {
    const fromCur = document.getElementById('fxFromCurrency').value;
    const toCur = document.getElementById('fxToCurrency').value;
    const amt = parseFloat(document.getElementById('fxSellAmount').value || 0);

    const fromRate = (FX_BENCHMARK_USD[fromCur] || { rate: 1 }).rate;
    const toRate = (FX_BENCHMARK_USD[toCur] || { rate: 1 }).rate;
    const crossRate = toRate / fromRate;
    const netOut = amt * crossRate * 0.9975;

    document.getElementById('fxFromSym').textContent = fromCur;
    document.getElementById('fxRateText').textContent = `1 ${fromCur} = ${crossRate.toFixed(4)} ${toCur}`;
    document.getElementById('fxReceivePreview').textContent = `${netOut.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} ${toCur}`;
}

async function initFXPage() {
    const tbody = document.getElementById('fxRatesTableBody');
    tbody.innerHTML = Object.entries(FX_BENCHMARK_USD).filter(([k]) => k !== 'USD').map(([code, info]) => `
        <tr>
            <td><span class="fw-bold font-mono">USD / ${code}</span></td>
            <td>${info.name}</td>
            <td class="text-end font-mono fw-bold text-primary">${info.rate.toFixed(4)}</td>
            <td class="text-end">
                <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2" onclick="document.getElementById('fxToCurrency').value='${code}';recalcFX();">
                    Select
                </button>
            </td>
        </tr>
    `).join('');

    recalcFX();

    try {
        const accRes = await FinanzaShell.api('/api/user/accounts');
        const accounts = Array.isArray(accRes) ? accRes : (accRes.accounts || []);
        document.getElementById('fxSourceAccount').innerHTML = accounts.map(a =>
            `<option value="${a.id}">${(a.account_type || 'Checking').toUpperCase()} (${a.account_number}) — ${FinanzaShell.fmt(a.balance, a.currency || 'USD', true)}</option>`
        ).join('');
    } catch (_) {}
}

document.getElementById('fxConvertForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('fxSubmitBtn');
    const orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Converting...';
    try {
        const fromCur = document.getElementById('fxFromCurrency').value;
        const toCur = document.getElementById('fxToCurrency').value;
        const amt = parseFloat(document.getElementById('fxSellAmount').value);
        const outText = document.getElementById('fxReceivePreview').textContent;

        const res = await FinanzaShell.api('/api/user/transfers', {
            method: 'POST',
            body: {
                from_account_id: document.getElementById('fxSourceAccount').value,
                transfer_type: 'fx_currency_exchange',
                recipient_name: `FX Multi-Currency Wallet (${toCur})`,
                recipient_account: `FX-${toCur}`,
                amount: amt,
                memo: `Converted ${amt.toFixed(2)} ${fromCur} -> ${outText}`
            }
        });
        FinanzaShell.toast(`FX Conversion executed: ${outText} (Ref: ${res.reference_number})`, 'success');
        await FinanzaShell.refreshUserContext();
        await initFXPage();
    } catch (err) {
        FinanzaShell.toast(err.message, 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = orig;
    }
});

document.addEventListener('DOMContentLoaded', initFXPage);
</script>
</body>
</html>
