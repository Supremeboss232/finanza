<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Cash Flow Analytics - Finanza Bank</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/user-portal.css" rel="stylesheet">
</head>
<body data-page-title="Cash Flow & Wealth Analytics" data-page-subtitle="Net worth balance sheet, inflow/outflow velocity & category breakdown">

<div id="bank-page-content" style="display:none;">
    <!-- Balance Sheet KPIs -->
    <div class="row g-3 mb-4">
        <div class="col-md-3 col-6">
            <div class="fb-kpi-card kpi-primary">
                <div class="fb-kpi-label">Total Net Worth</div>
                <div class="fb-kpi-value" id="anNetWorth">$0.00</div>
                <div class="fb-kpi-sub">Assets minus liabilities</div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="fb-kpi-card">
                <div class="fb-kpi-label">Total Assets</div>
                <div class="fb-kpi-value text-success" id="anTotalAssets">$0.00</div>
                <div class="fb-kpi-sub">Cash + CDs + Investments</div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="fb-kpi-card">
                <div class="fb-kpi-label">Total Liabilities</div>
                <div class="fb-kpi-value text-warning" id="anTotalLiabilities">$0.00</div>
                <div class="fb-kpi-sub">Outstanding loan balance</div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="fb-kpi-card">
                <div class="fb-kpi-label">Liquidity Ratio</div>
                <div class="fb-kpi-value text-primary" id="anLiquidityPct">100%</div>
                <div class="fb-kpi-sub">Cash & liquid reserves</div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="fb-card h-100">
                <div class="fb-card-header">
                    <h2 class="fb-card-title"><i class="fas fa-chart-column text-primary"></i> Asset Allocation Breakdown</h2>
                </div>
                <div class="fb-card-body">
                    <canvas id="assetAllocationChart" height="230"></canvas>
                </div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="fb-card h-100">
                <div class="fb-card-header">
                    <h2 class="fb-card-title"><i class="fas fa-scale-balanced text-primary"></i> Personal Balance Sheet Summary</h2>
                </div>
                <div class="fb-card-body" id="balanceSheetSummary">
                    <div class="text-center py-4 text-muted">Calculating balance sheet...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/static/js/user-shell.js"></script>
<script>
let allocChart = null;

async function loadAnalyticsPage() {
    try {
        const [accRes, depRes, invRes, loanRes] = await Promise.allSettled([
            FinanzaShell.api('/api/user/accounts'),
            FinanzaShell.api('/api/user/deposits'),
            FinanzaShell.api('/api/user/investments'),
            FinanzaShell.api('/api/user/loans')
        ]);

        const accounts = accRes.status === 'fulfilled'
            ? (Array.isArray(accRes.value) ? accRes.value : (accRes.value.accounts || []))
            : [];
        const deposits = (depRes.status === 'fulfilled' && Array.isArray(depRes.value)) ? depRes.value : [];
        const investments = (invRes.status === 'fulfilled' && Array.isArray(invRes.value)) ? invRes.value : [];
        const loans = (loanRes.status === 'fulfilled' && Array.isArray(loanRes.value)) ? loanRes.value : [];

        const cash = accounts.reduce((s, a) => s + Number(a.balance || 0), 0);
        const cds = deposits.filter(d => (d.status || '') === 'active').reduce((s, d) => s + Number(d.current_balance || d.amount || 0), 0);
        const inv = investments.filter(i => (i.status || '') === 'active').reduce((s, i) => s + Number(i.current_value || i.amount || 0), 0);
        const debt = loans.filter(l => (l.status || '') !== 'paid').reduce((s, l) => s + Number(l.remaining_balance ?? l.amount ?? 0), 0);

        const assets = cash + cds + inv;
        const netWorth = assets - debt;
        const liqPct = assets > 0 ? Math.round(((cash + cds) / assets) * 100) : 100;

        document.getElementById('anNetWorth').textContent = FinanzaShell.fmt(netWorth);
        document.getElementById('anTotalAssets').textContent = FinanzaShell.fmt(assets);
        document.getElementById('anTotalLiabilities').textContent = FinanzaShell.fmt(debt);
        document.getElementById('anLiquidityPct').textContent = `${liqPct}%`;

        document.getElementById('balanceSheetSummary').innerHTML = `
            <div class="d-flex justify-content-between py-2 border-bottom">
                <span class="text-muted">Checking & Savings Cash</span>
                <span class="fw-bold tabular-nums">${FinanzaShell.fmt(cash)}</span>
            </div>
            <div class="d-flex justify-content-between py-2 border-bottom">
                <span class="text-muted">Fixed Term CDs & Vaults</span>
                <span class="fw-bold tabular-nums text-success">${FinanzaShell.fmt(cds)}</span>
            </div>
            <div class="d-flex justify-content-between py-2 border-bottom">
                <span class="text-muted">Investments & Custody</span>
                <span class="fw-bold tabular-nums text-primary">${FinanzaShell.fmt(inv)}</span>
            </div>
            <div class="d-flex justify-content-between py-2 border-bottom">
                <span class="text-muted">Credit & Loan Balances</span>
                <span class="fw-bold tabular-nums text-warning">-${FinanzaShell.fmt(debt)}</span>
            </div>
            <div class="d-flex justify-content-between pt-3 mt-1">
                <span class="fw-extrabold">Net Equity Position</span>
                <span class="fs-5 fw-extrabold tabular-nums text-primary">${FinanzaShell.fmt(netWorth)}</span>
            </div>
        `;

        const ctx = document.getElementById('assetAllocationChart').getContext('2d');
        if (allocChart) allocChart.destroy();
        allocChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Liquid Cash', 'Savings & CDs', 'Investments', 'Loan Liabilities'],
                datasets: [{
                    label: 'USD Balance',
                    data: [cash, cds, inv, debt],
                    backgroundColor: ['#2563eb', '#059669', '#7c3aed', '#d97706'],
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true } }
            }
        });
    } catch (err) {
        console.error('[Analytics] Error:', err);
    }
}

document.addEventListener('DOMContentLoaded', loadAnalyticsPage);
window.addEventListener('finanza:mask-changed', loadAnalyticsPage);
</script>
</body>
</html>
