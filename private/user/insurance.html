<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Insurance & Protection - Finanza Bank</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/user-portal.css" rel="stylesheet">
</head>
<body data-page-title="Insurance & Asset Protection" data-page-subtitle="Comprehensive life, health, property, travel & cyber fraud protection">

<div id="bank-page-content" style="display:none;">
    <div class="row g-4 mb-4">
        <!-- Enroll in Protection Plan -->
        <div class="col-lg-5">
            <div class="fb-card h-100">
                <div class="fb-card-header">
                    <h2 class="fb-card-title"><i class="fas fa-shield-halved text-primary"></i> Enroll in Coverage Policy</h2>
                </div>
                <div class="fb-card-body">
                    <form id="insuranceEnrollForm">
                        <div class="mb-3">
                            <label class="form-label">Coverage Plan</label>
                            <select class="form-select" id="insPlanType" onchange="updateInsPreview()">
                                <option value="Executive Life & Family Shield" data-premium="150" data-cover="$500,000">Executive Life & Family Shield ($500,000 Coverage)</option>
                                <option value="Premier Global Health & Medical" data-premium="240" data-cover="$1,000,000">Premier Global Health & Medical ($1,000,000 Coverage)</option>
                                <option value="Residential Property & Casualty" data-premium="180" data-cover="$750,000">Residential Property & Casualty ($750,000 Coverage)</option>
                                <option value="Cyber, Wire & Identity Protection" data-premium="45" data-cover="$250,000">Cyber, Wire & Identity Protection ($250,000 Coverage)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Named Beneficiary / Insured Asset</label>
                            <input type="text" class="form-control" id="insBeneficiary" placeholder="e.g., Spouse / Primary Residence" required>
                        </div>
                        <div class="p-3 rounded-3 bg-light border mb-4">
                            <div class="d-flex justify-content-between small mb-1">
                                <span class="text-muted">Maximum Policy Limit</span>
                                <span class="fw-bold text-primary" id="insCoverLimit">$500,000</span>
                            </div>
                            <div class="d-flex justify-content-between align-items-center pt-2 border-top mt-2">
                                <span class="fw-semibold">Initial Premium Deposit</span>
                                <span class="fs-5 fw-extrabold text-success tabular-nums" id="insPremiumDisplay">$150.00</span>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2" id="insSubmitBtn">
                            <i class="fas fa-file-shield me-2"></i> Bind Policy & Pay Initial Premium
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Active Policies -->
        <div class="col-lg-7">
            <div class="fb-card h-100">
                <div class="fb-card-header">
                    <h2 class="fb-card-title"><i class="fas fa-file-signature text-primary"></i> Active Insurance Policies</h2>
                    <a href="/user/contact" class="btn btn-sm btn-outline-secondary">File a Claim</a>
                </div>
                <div class="table-responsive">
                    <table class="fb-table">
                        <thead>
                            <tr>
                                <th>Policy Name & Beneficiary</th>
                                <th>Paid Reserve</th>
                                <th>Effective Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="insurancePoliciesBody">
                            <tr><td colspan="4" class="text-center py-5 text-muted">Loading policies...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/user-shell.js"></script>
<script>
function updateInsPreview() {
    const sel = document.getElementById('insPlanType');
    const opt = sel.options[sel.selectedIndex];
    document.getElementById('insCoverLimit').textContent = opt.dataset.cover;
    document.getElementById('insPremiumDisplay').textContent = `$${Number(opt.dataset.premium).toFixed(2)}`;
}

async function loadInsurancePage() {
    updateInsPreview();
    try {
        const invs = await FinanzaShell.api('/api/user/investments');
        const policies = (Array.isArray(invs) ? invs : []).filter(i => (i.investment_type || '').toLowerCase() === 'insurance');
        const tbody = document.getElementById('insurancePoliciesBody');
        if (!policies.length) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-5 text-muted">No active insurance policies bound yet.</td></tr>`;
            return;
        }
        tbody.innerHTML = policies.map(p => `
            <tr>
                <td>
                    <div class="fw-bold">POL-${1000 + p.id} • ${p.purpose || 'Protection Policy'}</div>
                    <small class="text-muted">Underwritten by Finanza Assurance</small>
                </td>
                <td class="tabular-nums fw-bold">${FinanzaShell.fmt(p.amount)}</td>
                <td>${FinanzaShell.fmtDate(p.created_at)}</td>
                <td><span class="fb-badge fb-badge-success">Active In-Force</span></td>
            </tr>
        `).join('');
    } catch (err) {
        console.error('[Insurance] Error:', err);
    }
}

document.getElementById('insuranceEnrollForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const sel = document.getElementById('insPlanType');
    const opt = sel.options[sel.selectedIndex];
    const amount = parseFloat(opt.dataset.premium || 150);
    const beneficiary = document.getElementById('insBeneficiary').value;
    const btn = document.getElementById('insSubmitBtn');
    const orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Binding Policy...';
    try {
        await FinanzaShell.api('/api/user/investments', {
            method: 'POST',
            body: {
                investment_type: 'insurance',
                amount,
                purpose: `${sel.value} (Beneficiary: ${beneficiary})`
            }
        });
        FinanzaShell.toast('Insurance policy bound and active!', 'success');
        e.target.reset();
        updateInsPreview();
        await FinanzaShell.refreshUserContext();
        await loadInsurancePage();
    } catch (err) {
        FinanzaShell.toast(err.message, 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = orig;
    }
});

document.addEventListener('DOMContentLoaded', loadInsurancePage);
</script>
</body>
</html>
