[pytest]
# Only collect tests from the tests/ directory — prevents pytest from
# accidentally importing app/_main_legacy.py or other script files at root level.
testpaths = tests

# Async test mode for pytest-asyncio
asyncio_mode = auto

# Ignore the legacy app/ subpackage (old skeleton — not the live app)
collect_ignore_glob = app/*

# Helpful output
addopts = -v --tb=short
