<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Redirecting to Finanza Portal...</title>
    <script>
        (function() {
            var token = localStorage.getItem('token') || localStorage.getItem('access_token');
            var isAdmin = localStorage.getItem('is_admin') === 'true';
            if (token && token !== 'null' && token !== 'undefined') {
                window.location.replace(isAdmin ? '/user/admin/dashboard' : '/user/dashboard');
            } else {
                window.location.replace('/signin');
            }
        })();
    </script>
</head>
<body>
    <p style="font-family:sans-serif;text-align:center;margin-top:20vh;">Redirecting to Finanza E-Banking Portal...</p>
</body>
</html>
