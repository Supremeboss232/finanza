<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Notifications & Alerts - Finanza Bank</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/user-portal.css" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
    <script src="/static/js/pwa-init.js" defer></script>
</head>
<body data-page-title="Notifications & Security Alerts" data-page-subtitle="Real-time ledger confirmations, compliance updates & security alerts">

<div id="bank-page-content" style="display:none;">
    <div class="fb-card">
        <div class="fb-card-header">
            <h2 class="fb-card-title"><i class="fas fa-bell text-primary"></i> Activity & Alert Feed</h2>
            <div class="d-flex gap-2">
                <a href="/user/settings" class="btn btn-sm btn-outline-secondary">
                    <i class="fas fa-sliders me-1"></i> Alert Preferences
                </a>
                <button type="button" class="btn btn-sm btn-outline-danger" onclick="clearAllNotifications()">
                    <i class="fas fa-trash-can me-1"></i> Clear All
                </button>
            </div>
        </div>
        <div class="fb-card-body" id="notificationsFeedContainer">
            <div class="text-center py-5 text-muted">
                <i class="fas fa-spinner fa-spin me-2"></i>Loading notifications...
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/user-shell.js"></script>
<script>
async function loadNotificationsFeed() {
    try {
        const list = await FinanzaShell.api('/api/user/notifications');
        const box = document.getElementById('notificationsFeedContainer');
        if (!Array.isArray(list) || !list.length) {
            box.innerHTML = `
                <div class="text-center py-5">
                    <div class="fb-kpi-icon mx-auto mb-3" style="background:var(--fb-primary-soft);color:var(--fb-primary);">
                        <i class="far fa-bell-slash"></i>
                    </div>
                    <h5 class="fw-bold">You're All Caught Up</h5>
                    <p class="text-muted small mb-0">New transfer confirmations, card alerts, and security notices will appear here.</p>
                </div>
            `;
            return;
        }

        box.innerHTML = list.map(n => `
            <div class="d-flex align-items-start justify-content-between gap-3 p-3 rounded-3 mb-2 border ${n.is_read ? 'bg-white' : 'bg-light border-primary-subtle'}">
                <div class="d-flex align-items-start gap-3">
                    <span class="fb-kpi-icon" style="background:var(--fb-primary-soft);color:var(--fb-primary);">
                        <i class="fas fa-bell"></i>
                    </span>
                    <div>
                        <div class="fw-bold">${n.title || 'Banking Alert'}</div>
                        <div class="small text-secondary my-1">${n.message || ''}</div>
                        <small class="text-muted">${FinanzaShell.fmtDate(n.created_at, true)}</small>
                    </div>
                </div>
                <div>
                    ${!n.is_read ? `
                        <button class="btn btn-sm btn-outline-primary" onclick="markNotificationRead(${n.id})">Mark Read</button>
                    ` : '<span class="fb-badge fb-badge-neutral">Read</span>'}
                </div>
            </div>
        `).join('');
    } catch (err) {
        console.error('[Notifications] Error:', err);
    }
}

async function markNotificationRead(id) {
    try {
        await FinanzaShell.api(`/api/user/notifications/${id}/read`, { method: 'POST' });
        await FinanzaShell.refreshUserContext();
        await loadNotificationsFeed();
    } catch (err) {
        FinanzaShell.toast(err.message, 'error');
    }
}

async function clearAllNotifications() {
    try {
        await FinanzaShell.api('/api/user/notifications', { method: 'DELETE' });
        FinanzaShell.toast('All notifications cleared.', 'info');
        await FinanzaShell.refreshUserContext();
        await loadNotificationsFeed();
    } catch (err) {
        FinanzaShell.toast(err.message, 'error');
    }
}

document.addEventListener('DOMContentLoaded', loadNotificationsFeed);
</script>
</body>
</html>
