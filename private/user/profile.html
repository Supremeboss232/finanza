<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>My Profile - Finanza Bank</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/user-portal.css" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
    <script src="/static/js/pwa-init.js" defer></script>
</head>
<body data-page-title="Client Profile" data-page-subtitle="Personal identity, residential address & employment records">

<div id="bank-page-content" style="display:none;">
    <div class="row g-4">
        <!-- Left Card: Avatar & Account Summary -->
        <div class="col-lg-4">
            <div class="fb-card text-center p-4 mb-4">
                <div class="position-relative d-inline-block mx-auto mb-3">
                    <div id="profAvatarBox" class="rounded-circle d-flex align-items-center justify-content-center mx-auto fw-extrabold fs-2 text-white" style="width:96px;height:96px;background:linear-gradient(135deg,#2563eb,#059669);overflow:hidden;">
                        FB
                    </div>
                </div>
                <h4 class="fw-bold mb-1" id="profDisplayName">—</h4>
                <div class="text-muted small mb-3" id="profDisplayEmail">—</div>

                <form id="avatarUploadForm" class="mb-3">
                    <label class="btn btn-sm btn-outline-primary">
                        <i class="fas fa-camera me-1"></i> Upload Photo
                        <input type="file" id="avatarFileInput" accept="image/*" hidden onchange="uploadAvatarNow(this)">
                    </label>
                </form>

                <div class="text-start pt-3 border-top small">
                    <div class="d-flex justify-content-between py-2 border-bottom">
                        <span class="text-muted">Primary Account #</span>
                        <code class="bank-code fw-bold text-primary" id="profAcctNum">—</code>
                    </div>
                    <div class="d-flex justify-content-between py-2 border-bottom">
                        <span class="text-muted">Account Tier</span>
                        <span class="fw-semibold" id="profTierLabel">Private Client</span>
                    </div>
                    <div class="d-flex justify-content-between pt-2">
                        <span class="text-muted">Member Since</span>
                        <span class="fw-semibold" id="profCreatedAt">—</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Card: Complete Profile Form -->
        <div class="col-lg-8">
            <div class="fb-card">
                <div class="fb-card-header">
                    <h2 class="fb-card-title"><i class="fas fa-user-tie text-primary"></i> Personal, Residential & Employment Profile</h2>
                </div>
                <div class="fb-card-body">
                    <form id="profileUpdateForm">
                        <h6 class="text-uppercase text-muted fw-bold small mb-3">1. Personal Information</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label">Full Legal Name</label>
                                <input type="text" class="form-control" id="pfFullName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="pfEmail" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Mobile Phone</label>
                                <input type="text" class="form-control" id="pfPhone" placeholder="+1 (555) 000-0000">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" id="pfDob">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Nationality</label>
                                <input type="text" class="form-control" id="pfNationality" placeholder="United States">
                            </div>
                        </div>

                        <h6 class="text-uppercase text-muted fw-bold small mb-3">2. Residential Address</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-12">
                                <label class="form-label">Street Address</label>
                                <input type="text" class="form-control" id="pfStreet" placeholder="100 Financial Avenue, Suite 14B">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">City</label>
                                <input type="text" class="form-control" id="pfCity">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">State / Province</label>
                                <input type="text" class="form-control" id="pfState">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Postal / ZIP Code</label>
                                <input type="text" class="form-control" id="pfZip">
                            </div>
                        </div>

                        <h6 class="text-uppercase text-muted fw-bold small mb-3">3. Employment & Income Profile</h6>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label class="form-label">Occupation / Title</label>
                                <input type="text" class="form-control" id="pfOccupation" placeholder="Executive / Engineer">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Employer / Organization</label>
                                <input type="text" class="form-control" id="pfEmployer" placeholder="Company Name">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Annual Income Bracket</label>
                                <select class="form-select" id="pfIncome">
                                    <option value="$50,000 - $100,000">$50,000 – $100,000</option>
                                    <option value="$100,000 - $250,000">$100,000 – $250,000</option>
                                    <option value="$250,000 - $500,000">$250,000 – $500,000</option>
                                    <option value="$500,000+">$500,000+</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary px-4" id="pfSaveBtn">
                                <i class="fas fa-floppy-disk me-2"></i> Save Profile Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/user-shell.js"></script>
<script>
async function loadProfilePage() {
    try {
        const p = await FinanzaShell.api('/api/user/profile');
        document.getElementById('profDisplayName').textContent = p.full_name || p.username || 'Client';
        document.getElementById('profDisplayEmail').textContent = p.email || '';
        document.getElementById('profAcctNum').textContent = p.account_number || '—';
        document.getElementById('profCreatedAt').textContent = FinanzaShell.fmtDate(p.created_at);

        const avatarBox = document.getElementById('profAvatarBox');
        if (p.profile_picture_url || p.avatar_url) {
            avatarBox.innerHTML = `<img src="${p.profile_picture_url || p.avatar_url}" style="width:100%;height:100%;object-fit:cover;">`;
        }

        document.getElementById('pfFullName').value = p.full_name || '';
        document.getElementById('pfEmail').value = p.email || '';
        document.getElementById('pfPhone').value = p.phone || p.phone_number || '';
        document.getElementById('pfDob').value = p.date_of_birth ? String(p.date_of_birth).slice(0, 10) : '';
        document.getElementById('pfNationality').value = p.nationality || '';
        document.getElementById('pfStreet').value = p.street_address || p.address || '';
        document.getElementById('pfCity').value = p.city || '';
        document.getElementById('pfState').value = p.state || '';
        document.getElementById('pfZip').value = p.zip_code || p.postal_code || '';
        document.getElementById('pfOccupation').value = p.occupation || '';
        document.getElementById('pfEmployer').value = p.employer || '';
        if (p.income_range) document.getElementById('pfIncome').value = p.income_range;
    } catch (err) {
        console.error('[Profile] Error:', err);
    }
}

async function uploadAvatarNow(inputEl) {
    if (!inputEl.files || !inputEl.files[0]) return;
    const fd = new FormData();
    fd.append('file', inputEl.files[0]);
    try {
        const res = await FinanzaShell.api('/api/user/upload-profile-picture', {
            method: 'POST',
            body: fd
        });
        FinanzaShell.toast('Profile photo updated!', 'success');
        await FinanzaShell.refreshUserContext();
        await loadProfilePage();
    } catch (err) {
        FinanzaShell.toast(err.message, 'error');
    }
}

document.getElementById('profileUpdateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('pfSaveBtn');
    const orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Saving...';
    try {
        await FinanzaShell.api('/api/user/profile', {
            method: 'PUT',
            body: {
                full_name: document.getElementById('pfFullName').value,
                email: document.getElementById('pfEmail').value,
                phone: document.getElementById('pfPhone').value,
                date_of_birth: document.getElementById('pfDob').value,
                nationality: document.getElementById('pfNationality').value,
                street_address: document.getElementById('pfStreet').value,
                address: document.getElementById('pfStreet').value,
                city: document.getElementById('pfCity').value,
                state: document.getElementById('pfState').value,
                zip_code: document.getElementById('pfZip').value,
                occupation: document.getElementById('pfOccupation').value,
                employer: document.getElementById('pfEmployer').value,
                income_range: document.getElementById('pfIncome').value
            }
        });
        FinanzaShell.toast('Profile updated and saved.', 'success');
        await FinanzaShell.refreshUserContext();
        await loadProfilePage();
    } catch (err) {
        FinanzaShell.toast(err.message, 'error');
    } finally {
        btn.disabled = false;
        btn.innerHTML = orig;
    }
});

document.addEventListener('DOMContentLoaded', loadProfilePage);
</script>
</body>
</html>
